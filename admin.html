<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل صدور گواهی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma; }
    body { background: #f1f5f9; padding: 20px; display: flex; justify-content: center; }
    .box { background: #fff; width: 100%; max-width: 600px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e3a8a; margin-bottom: 20px; font-size: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    input:focus { border-color: #1e3a8a; outline: none; }
    .full { grid-column: 1 / -1; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0f2f5e; }
    #result { display: none; margin-top: 15px; padding: 10px; background: #dcfce7; border: 1px solid #16a34a; border-radius: 4px; text-align: center; font-size: 12px; word-break: break-all; }
    #result a { color: #166534; font-weight: bold; }
    .error { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
  </style>
</head>
<body>

  <div class="box">
    <h2>پنل صدور گواهی</h2>
    <form id="form">
      <div class="grid">
        <input type="text" id="name" placeholder="نام و نام خانوادگی" required class="full">
        <input type="text" id="father" placeholder="نام پدر" required>
        <input type="text" id="nid" placeholder="کد ملی" required>
        <input type="text" id="birth" placeholder="سال تولد" required>
        <input type="text" id="degree" placeholder="مقطع تحصیلی" required>
        <input type="text" id="major" placeholder="رشته تحصیلی" required>
        <input type="text" id="units" placeholder="تعداد واحد" required>
        <input type="text" id="gpa" placeholder="معدل کل" required>
        <input type="text" id="gradDate" placeholder="تاریخ اتمام تحصیل" required>
        <input type="text" id="certNum" placeholder="شماره دانشنامه" required>
        <input type="text" id="certDate" placeholder="تاریخ تایید مرکزی" required class="full">
      </div>
      <button type="submit" id="btn">ساخت گواهی و دریافت لینک</button>
    </form>
    <div id="result">
      <span id="resultText"></span><br>
      <a href="#" id="link" target="_blank"></a>
    </div>
  </div>

  <script>
    // آدرس ورکر شما به صورت خودکار وارد شده است
    const API_URL = "https://iau-estelam-org.asnadir361.workers.dev"; 

    const rndNum = () => `۱۴۰۳/${Math.floor(1000 + Math.random() * 9000)}/م`;
    const rndCode = () => `۱۰۱۶**${Math.floor(1000 + Math.random() * 9000)}**${Math.floor(1000 + Math.random() * 9000)}`;

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const resultBox = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const link = document.getElementById('link');

      btn.innerText = "در حال ذخیره...";
      btn.disabled = true;
      resultBox.style.display = 'none';
      resultBox.classList.remove('error');

      const data = {
        name: document.getElementById('name').value,
        father: document.getElementById('father').value,
        nid: document.getElementById('nid').value,
        birth: document.getElementById('birth').value,
        degree: document.getElementById('degree').value,
        major: document.getElementById('major').value,
        units: document.getElementById('units').value,
        gpa: document.getElementById('gpa').value,
        gradDate: document.getElementById('gradDate').value,
        certNum: document.getElementById('certNum').value,
        certDate: document.getElementById('certDate').value,
        docNum: rndNum(),
        verifyCode: rndCode()
      };

      try {
        const res = await fetch(`${API_URL}/api/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const json = await res.json();

        if (json.success) {
          const finalLink = `${window.location.origin}/index.html?id=${json.id}`;
          resultBox.classList.remove('error');
          resultText.innerText = "گواهی با موفقیت ساخته شد!";
          link.href = finalLink;
          link.innerText = finalLink;
        } else {
          resultBox.classList.add('error');
          resultText.innerText = "خطای دیتابیس: " + json.error;
        }
      } catch (err) {
        resultBox.classList.add('error');
        resultText.innerText = "خطای شبکه (CORS یا آدرس اشتباه): " + err.message;
      } finally {
        resultBox.style.display = 'block';
        btn.innerText = "ساخت گواهی و دریافت لینک";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
