<script>
  // ⚠️ آدرس ورکر خودتان را اینجا قرار دهید
  const API_URL = "https://YOUR-WORKER-URL.workers.dev"; 

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  // ثبت تاریخ امروز
  document.getElementById('docDate').innerText = new Date().toLocaleDateString('fa-IR');

  if (id) {
    fetch(`${API_URL}/api/get?id=${id}`)
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          alert("خطا: گواهی مورد نظر یافت نشد.");
          return;
        }
        const fields = ['name', 'father', 'nid', 'birth', 'degree', 'major', 'units', 'gpa', 'gradDate', 'certNum', 'certDate', 'docNum', 'verifyCode'];
        fields.forEach(f => {
          document.getElementById(f).innerText = data[f];
        });
      })
      .catch(() => alert("خطا در برقراری ارتباط با سرور!"));
  }
</script>
